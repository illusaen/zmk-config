name: Build ZMK firmware (nix)
on:
  workflow_dispatch:
  push:
    paths:
      - config/**
      - build.yaml
      - flake.nix
      - flake.lock
      - nix/**
      - .github/workflows/build-nix.yml
  pull_request:
    paths:
      - config/**
      - build.yaml
      - flake.nix
      - flake.lock
      - nix/**
      - .github/workflows/build-nix.yml

permissions:
  contents: read

jobs:
  build:
    uses: urob/zmk-actions/.github/workflows/build-user-config.yml@main
    with:
      # Set to 'gnuarmemb' (fastest), 'zephyr' or, 'zephyr-full' (most
      # compatible). ZMK Studio requires 'zephyr-full'.
      toolchain: zephyr-full
