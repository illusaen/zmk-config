parse_config:
  zmk_additional_includes:
    - "modules/zmk/helpers/include"

  zmk_preamble: |
    #include <zmk-helpers/key-labels/34.h>
    #define CONFIG_WIRELESS

  raw_binding_map:
    "&sys_reset": Reset
    "&bootloader": Boot
    "&studio_unlock": Studio
    "&caps_word": Caps Word

    "&kp LC(INS)": $$mdi:content-copy$$
    "&kp LC(X)": $$mdi:content-cut$$
    "&kp LS(INS)": $$mdi:content-paste$$
    "&kp LC(S)": $$mdi:content-save-outline$$

    "&kp LA(LS(N4))": $$mdi:cellphone-screenshot$$
    "&kp LA(LS(T))": $$mdi:console-line$$
    "&kp LC(SPACE)": $$mdi:rocket-launch$$
    "&kp LC(FSLH)": //
    "&kp LC(HOME)": Doc S
    "&kp LC(END)": Doc E
    "&kp LC(LA(LS(M)))": HDMI
    "&kp LC(LA(M))": DP

    "&swapper": AltTb
    "LS(LCTRL) LS(TAB)": { "t": $$mdi:keyboard-tab-reverse$$, "h": "" }
    "&kp LS(TAB)": { "t": $$mdi:keyboard-tab-reverse$$, "h": "" }
    "&dot_spc": Sntnce
    "&num_dance": { "t": "Smart"}
    "&magic_shift": { "t": Magic, "h": "Shift" }
    "&key_repeat": Rpt

    "&dbl_arrow": =>
    "&sgl_arrow": ->
    "&const_fn": JS ()

    "&hml LS(LALT)TAB": { "t": $$mdi:keyboard-tab$$, "h": "" }
    "&hml LS(LCTRL) LS(TAB)": { "t": $$mdi:keyboard-tab-reverse$$, "h": "" }
    "&hm_combo_lpar": { "t": "< (" }
    "&hm_combo_rpar": { "t": "> )"}
    "&kp LBKT": { "t": "{ ["}
    "&kp RBKT": { "t": "} ]"}

    "WORD_KEB": "wd-md"
    "WORD_PAS": "WdMd"
    "WORD_PTH": "wd/md"
    "WORD_UND": "wd_md"
    "CAPS_UND": "WD_MD"

    "NAV_BSPC": { t: $$mdi:backspace-outline$$, h: "word" }
    "&mt LC(DEL) DEL": { t: $$mdi:backspace-reverse-outline$$, h: "word" }

  trans_legend: { "t": "", "type": "trans" }

  zmk_combos:
    combo_cut: { align: bottom, o: 0.15 }
    combo_ldrsh: { align: top, o: 1.35 }

    combo_lt: { hidden: true }
    combo_gt: { hidden: true }
    combo_lbrc: { hidden: true }
    combo_rbrc: { hidden: true }
    combo_cancel: { align: top, o: 0.5 }
    combo_save: { align: bottom, o: 0.2 }
    combo_bootloader: { align: top, o: 0.35 }

  zmk_keycode_map:
    # custom mappings
    LALT: $$mdi:apple-keyboard-option$$
    LCTRL: $$mdi:apple-keyboard-control$$
    LGUI: $$mdi:apple-keyboard-command$$
    LSHFT: $$mdi:apple-keyboard-shift$$
    RSHFT: $$mdi:apple-keyboard-shift$$

    BSPC: $$mdi:backspace-outline$$
    DEL: $$mdi:backspace-reverse-outline$$
    ESC: $$mdi:keyboard-esc$$
    RET: $$mdi:keyboard-return$$
    SPACE: $$mdi:keyboard-space$$
    LS(TAB): { "t": $$mdi:keyboard-tab-reverse$$, "h": "" }
    PAUSE_BREAK: Break

    PG_UP: PgUp
    PG_DN: PgDn
    INS: Ins
    HOME: Home
    END: End

    UP: ↑
    DOWN: ↓
    LEFT: ←
    RIGHT: →

    K_CANCEL: $$mdi:close-thick$$

    C_MUTE: $$mdi:volume-off$$
    C_PP: $$mdi:play-pause$$
    C_VOL_UP: $$mdi:volume-high$$
    C_VOL_DN: $$mdi:volume-medium$$
    C_NEXT: $$mdi:skip-forward$$
    C_PREV: $$mdi:skip-backward$$
    C_BRI_INC: $$mdi:brightness-4$$
    C_BRI_DEC: $$mdi:brightness-5$$

    # defaults
    AMPERSAND: "&"
    AMPS: "&"
    APOS: "'"
    APOSTROPHE: "'"
    ASTERISK: "*"
    ASTRK: "*"
    AT: "@"
    AT_SIGN: "@"
    BACKSLASH: \
    BSLH: \
    CARET: ^
    COLON: ":"
    COMMA: ","
    DLLR: $
    DOLLAR: $
    DOT: .
    DOUBLE_QUOTES: '"'
    DQT: '"'
    EQUAL: "="
    EXCL: "!"
    EXCLAMATION: "!"
    FSLH: /
    GRAVE: "`"
    GREATER_THAN: ">"
    GT: ">"
    HASH: "#"
    LBKT: "["
    LBRC: "{"
    LEFT_BRACE: "{"
    LEFT_BRACKET: "["
    LEFT_PARENTHESIS: (
    LESS_THAN: <
    LPAR: (
    LT: <
    MINUS: "-"
    NON_US_BACKSLASH: \
    NON_US_BSLH: "|"
    NON_US_HASH: "#"
    NUHS: "#"
    PERCENT: "%"
    PERIOD: .
    PIPE: "|"
    PIPE2: "|"
    PLUS: +
    POUND: "#"
    PRCNT: "%"
    QMARK: "?"
    QUESTION: "?"
    RBKT: "]"
    RBRC: "}"
    RIGHT_BRACE: "}"
    RIGHT_BRACKET: "]"
    RIGHT_PARENTHESIS: )
    RPAR: )
    SEMI: ;
    SEMICOLON: ;
    SINGLE_QUOTE: "'"
    SLASH: /
    SQT: "'"
    STAR: "*"
    TILDE: "~"
    TILDE2: "~"
